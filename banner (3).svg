<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Md Rifath Ahamed. Computational evolutionary biology. A phylogenetic tree with rug plots draws itself.">
  <style>
    :root { --ink: #1f2328; --soft: #59636e; --cell: #8c959f; --bg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e6edf3; --soft: #9198a1; --cell: #6e7681; --bg: #0d1117; }
    }
    .name  { font: 700 38px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .tag   { font: 400 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .meta  { font: 400 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--soft); }
    .tip   { font: italic 13px Georgia, "Times New Roman", serif; fill: var(--soft); opacity: 0;
             animation: fade .5s ease-out 1.5s forwards; }
    .b     { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: square;
             stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s ease-in-out forwards; }
    .b2    { animation-delay: .35s; }
    .b3    { animation-delay: .7s; }
    .rug   { opacity: 0; animation: fade .4s ease-out forwards; }
    .rug rect { stroke: var(--cell); stroke-width: 1; }
    .on    { fill: var(--ink); }
    .off   { fill: var(--bg); }
    .r1    { animation-delay: 1.9s; }
    .r2    { animation-delay: 2.2s; }
    .dot   { fill: var(--ink); transform-box: fill-box; transform-origin: center; transform: scale(0);
             animation: pop .35s ease-out forwards; }
    .d1    { animation-delay: 2.5s; }
    .d2    { animation-delay: 2.7s; }
    .line  { stroke: var(--cell); stroke-width: 1; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes pop  { 70% { transform: scale(1.3); } to { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .b { stroke-dashoffset: 0; animation: none; }
      .tip, .rug { opacity: 1; animation: none; }
      .dot { transform: scale(1); animation: none; }
    }
  </style>

  <!-- left: text -->
  <text class="name" x="30" y="105">Md Rifath Ahamed</text>
  <text class="tag"  x="30" y="140">Computational evolutionary biology</text>
  <line class="line" x1="30" y1="160" x2="420" y2="160"/>
  <text class="meta" x="30" y="185">Phylogenetics · morphological evolution · spatial data</text>
  <text class="meta" x="30" y="206">University of Helsinki · Finnish Museum of Natural History</text>

  <!-- right: tree ((A,B),C),((D,E),F) drawn in phylorug style -->
  <path class="b"    pathLength="1" d="M540,141.5 H560 M560,90.5 V192.5 M560,90.5 H620 M560,192.5 H620"/>
  <path class="b b2" pathLength="1" d="M620,65 V116 M620,65 H690 M620,116 H800 M620,167 V218 M620,167 H690 M620,218 H800"/>
  <path class="b b3" pathLength="1" d="M690,48 V82 M690,48 H800 M690,82 H800 M690,150 V184 M690,150 H800 M690,184 H800"/>

  <text class="tip" x="810" y="52">Onthophagus</text>
  <text class="tip" x="810" y="86">Caccobius</text>
  <text class="tip" x="810" y="120">Phalops</text>
  <text class="tip" x="810" y="154">Kheper</text>
  <text class="tip" x="810" y="188">Scarabaeus</text>
  <text class="tip" x="810" y="222">Copris</text>

  <!-- rug plots: one cell per comparison tree -->
  <g class="rug r1">
    <rect class="on"  x="595" y="66" width="11" height="11"/>
    <rect class="off" x="606" y="66" width="11" height="11"/>
    <rect class="on"  x="595" y="77" width="11" height="11"/>
    <rect class="on"  x="606" y="77" width="11" height="11"/>
  </g>
  <g class="rug r2">
    <rect class="on"  x="665" y="142" width="11" height="11"/>
    <rect class="on"  x="676" y="142" width="11" height="11"/>
    <rect class="off" x="665" y="153" width="11" height="11"/>
    <rect class="on"  x="676" y="153" width="11" height="11"/>
  </g>

  <!-- dots: clade recovered by every tree -->
  <circle class="dot d1" cx="690" cy="65"    r="6"/>
  <circle class="dot d2" cx="620" cy="192.5" r="6"/>
</svg>
